name: Build VoidLink IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: Integration
          submodules: recursive

      - name: Patch Incompatible Developer Code
        run: |
          # The developer used a brand new iOS UI feature that the cloud builder doesn't support yet.
          # This command searches all Swift files and comments out the breaking lines.
          find . -type f -name "*.swift" -exec sed -i '' 's/.*hidesSharedBackground.*/\/\/ Patched for Xcode runner compatibility/g' {} +

      - name: Compile and Build Unsigned IPA
        run: |
          # 1. Find the exact Xcode project file name
          PROJECT=$(ls -d *.xcodeproj | head -n 1)
          
          # 2. Extract the actual scheme, strictly ignoring background libraries, TV, and Watch targets
          SCHEME=$(xcodebuild -list -project "$PROJECT" | awk '/Schemes:/{flag=1; next} flag' | grep -iE "Moonlight|VoidLink|Limelight" | grep -iv "TV" | grep -iv "common" | grep -iv "watch" | head -n 1 | xargs)
          
          # 3. Build the app using the securely discovered scheme
          xcodebuild clean build -project "$PROJECT" -scheme "$SCHEME" -configuration Release -sdk iphoneos CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO -derivedDataPath Build_out
          
          # 4. Pack the compiled app into an IPA
          mkdir Payload
          APP_PATH=$(find Build_out/Build/Products/Release-iphoneos -maxdepth 1 -type d -name "*.app" | head -n 1)
          cp -R "$APP_PATH" Payload/
          zip -r VoidLink.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VoidLink-IPA
          path: VoidLink.ipa
